<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scrap Hack Timer</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14100c">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* A countdown that lives only in this browser. It stores the finish time, so sleep, reloads and closed tabs do not stop it. */
:root{--ink:#14100c;--bench:#1a1510;--paper:#ebe2cf;--yellow:#ffe500;--rust:#e2491a;--mute:#b8ab92;--line:#3a3025;--display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;--sans:'Instrument Sans',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bench);color:#f3ead6;font-family:var(--sans);font-size:16px;line-height:1.5;display:flex;flex-direction:column;min-height:100svh}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.top a{text-decoration:none;color:#d9cdb4;padding:8px 0}
.top a:hover{color:var(--yellow)}
.top span{color:var(--mute)}

main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 20px 40px;gap:clamp(18px,4vh,40px)}
.lbl{margin:0;font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;text-transform:uppercase;font-size:clamp(22px,4vw,48px);line-height:1;color:var(--yellow);min-height:1em}
.clock{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;font-variant-numeric:tabular-nums;font-size:clamp(64px,19vw,300px);line-height:.86;letter-spacing:-.01em;color:#f7efdc;white-space:nowrap}
.clock .c{color:var(--mute);margin:0 .02em}
.sub{margin:0;font-size:clamp(14px,1.6vw,18px);font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);min-height:1.5em}
.paused .clock{color:var(--mute)}
.done .clock{color:var(--rust);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.done .lbl{color:var(--rust)}

/* controls */
.ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{min-height:46px;padding:10px 20px;border-radius:10px;border:2px solid #f3ead6;background:transparent;font-weight:600;font-size:16px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.go{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.btn.go:hover{background:#fff56b}
.btn.warn{border-color:var(--rust);color:#ff8a5c}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px;border-color:#5a4c3a;color:#d9cdb4}
.btn[hidden]{display:none}

/* setup */
.setup{width:min(640px,100%);text-align:left;border:1px solid var(--line);border-radius:14px;padding:22px 22px 24px;background:var(--ink)}
.setup h2{margin:0 0 16px;font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;text-transform:uppercase;font-size:28px;line-height:1}
.tabs{display:flex;gap:6px;margin-bottom:18px}
.tabs button{flex:1;min-height:42px;border:2px solid #5a4c3a;background:none;border-radius:8px;font-weight:600;cursor:pointer;color:#d9cdb4}
.tabs button[aria-pressed="true"]{border-color:var(--yellow);color:var(--ink);background:var(--yellow)}
label{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 6px}
input{width:100%;min-height:46px;padding:8px 12px;border:2px solid #5a4c3a;border-radius:8px;background:var(--bench);font-size:18px}
input:focus{border-color:var(--yellow);outline:0}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field{margin-bottom:16px}
.presets{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 18px}
.presets button{min-height:38px;padding:6px 12px;border:1px dashed #6a5a44;border-radius:8px;background:none;color:#d9cdb4;font-size:14px;cursor:pointer}
.presets button:hover{border-color:var(--yellow);color:var(--yellow)}
.hint{margin:4px 0 0;font-size:13.5px;color:#8d806a}
.err{color:#ff8a5c;font-size:14px;margin:0 0 12px;min-height:1.2em}

footer{padding:14px 20px 18px;font-size:12.5px;color:#8d806a;text-align:center}

/* background: scrap parts drifting up past the clock */
.top,main,footer{position:relative;z-index:2}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bit{position:absolute;bottom:-90px;animation:rise var(--d) linear var(--dl) infinite;will-change:transform}
.bit>div{animation:sway var(--sw) ease-in-out var(--dl) infinite alternate}
.bit svg{display:block;width:var(--w);height:auto;opacity:var(--o);animation:turn var(--rt) linear infinite;animation-direction:var(--rd)}
@keyframes rise{to{transform:translateY(calc(-100vh - 180px))}}
@keyframes sway{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes turn{to{transform:rotate(360deg)}}
.paused .bit,.paused .bit>div,.paused .bit svg{animation-play-state:paused}
.done .bg{animation:shake .25s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}

/* the crew from the main site, sitting along the bottom and watching the clock */
.crew{position:fixed;left:0;right:0;bottom:-6px;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;padding:0 clamp(12px,4vw,56px);pointer-events:none}
.crew .slot{width:clamp(64px,7vw,108px);pointer-events:auto;cursor:pointer}
.crew .slot:nth-child(2){margin-bottom:-14px}
.slot svg{display:block;width:100%;height:auto;overflow:visible}
.sticker{filter:drop-shadow(3px 0 0 #fbf0b6) drop-shadow(-3px 0 0 #fbf0b6) drop-shadow(0 3px 0 #fbf0b6) drop-shadow(0 -3px 0 #fbf0b6) drop-shadow(6px 9px 0 rgba(0,0,0,.35))}
.bob{animation:bob 3.6s ease-in-out infinite}
.bob.b2{animation-duration:4.2s;animation-delay:-1.2s}
.bob.b3{animation-duration:3.1s;animation-delay:-2s}
.look{transform-box:fill-box;transform-origin:center;animation:eyeblink 5.5s infinite}
.pupil{transition:transform .2s ease-out}
.blades{animation:spin 1.1s linear infinite;transform-origin:100px 70px}
.waver{animation:wave 1.4s ease-in-out infinite}
.glow{animation:glim 2.6s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes eyeblink{0%,91%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
@keyframes glim{0%,100%{opacity:.3}45%{opacity:.7}50%{opacity:.2}55%{opacity:.75}}
.paused .blades,.paused .waver{animation-play-state:paused}
.done .crew .slot{animation:hop .5s ease-in-out infinite alternate}
.done .crew .slot:nth-child(2){animation-delay:-.25s}
@keyframes hop{to{transform:translateY(-22px)}}
.say{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#fbf0b6;color:var(--ink);font:600 14px/1 var(--sans);padding:8px 11px;border-radius:12px;white-space:nowrap;box-shadow:2px 3px 0 rgba(0,0,0,.35);pointer-events:none;animation:say 1.9s ease forwards}
.say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#fbf0b6}
@keyframes say{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.8)}12%,80%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}
.crew .slot{position:relative}
main{padding-bottom:clamp(100px,11vw,150px)}
@media (max-width:600px){.crew .slot{width:58px}main{padding-bottom:96px}}
@media (prefers-reduced-motion:reduce){.bit,.bit>div,.bit svg,.bob,.look,.blades,.waver,.glow,.done .bg,.done .crew .slot{animation:none!important}}

/* full screen / projector: hide everything but the clock until the mouse moves */
.calm .top,.calm .ctl,.calm footer{opacity:0;transition:opacity .4s}
.calm{cursor:none}
@media (max-width:600px){.row{gap:6px}.setup{padding:18px 16px 20px}}
@media (prefers-reduced-motion:reduce){.done .clock{animation:none}}
</style>
</head>

<div class="bg" id="bg" aria-hidden="true"></div>

<header class="top"><a href="../index.html">&larr; Scrap Hack</a></header>

<main id="app">
  <section id="face" hidden>
    <p class="lbl" id="lblOut"></p>
    <div class="clock" id="clock" role="timer" aria-live="off">00<span class="c">:</span>00<span class="c">:</span>00</div>
    <p class="sub" id="sub"></p>
  </section>

  <div class="ctl" id="ctl" hidden>
    <button class="btn go" id="pause" type="button">Pause</button>
    <button class="btn go" id="resume" type="button" hidden>Resume</button>
    <button class="btn sm" id="minus" type="button" title="Take 5 minutes off">&minus;5 min</button>
    <button class="btn sm" id="plus" type="button" title="Add 5 minutes">+5 min</button>
    <button class="btn sm" id="full" type="button">Full screen</button>
    <button class="btn warn" id="reset" type="button">Reset</button>
  </div>

  <form class="setup" id="setup" hidden>
    <h2>Set the timer</h2>
    <div class="tabs" role="group" aria-label="Timer mode">
      <button type="button" data-mode="dur" aria-pressed="true">Run for</button>
      <button type="button" data-mode="until" aria-pressed="false">Run until</button>
    </div>
    <div class="field"><label for="name">Label (optional)</label><input id="name" maxlength="60" placeholder="e.g. Kochi build time" autocomplete="off"></div>

    <div id="durBox">
      <div class="presets"><button type="button" data-p="18,0,Kochi build time">18 h (Kochi)</button><button type="button" data-p="12,0,Calicut build time">12 h (Calicut)</button><button type="button" data-p="1,0,">1 h</button><button type="button" data-p="0,30,">30 min</button><button type="button" data-p="0,5,">5 min</button></div>
      <div class="row field">
        <div><label for="h">Hours</label><input id="h" type="number" inputmode="numeric" min="0" max="99" value="0"></div>
        <div><label for="m">Minutes</label><input id="m" type="number" inputmode="numeric" min="0" max="59" value="0"></div>
        <div><label for="s">Seconds</label><input id="s" type="number" inputmode="numeric" min="0" max="59" value="0"></div>
      </div>
    </div>

    <div id="untilBox" hidden>
      <div class="row2 field">
        <div><label for="ud">Date</label><input id="ud" type="date"></div>
        <div><label for="ut">Time</label><input id="ut" type="time" step="60"></div>
      </div>
      <p class="hint">Uses this laptop's clock and time zone.</p>
    </div>

    <p class="err" id="err" role="alert"></p>
    <button class="btn go" type="submit">Start</button>
  </form>
</main>


<script>
(function(){
  var KEY='scraphack.timer.v1';
  var $=function(id){return document.getElementById(id)};
  var face=$('face'),ctl=$('ctl'),setup=$('setup'),clock=$('clock'),sub=$('sub'),lblOut=$('lblOut'),err=$('err');
  var mode='dur',st=null,beeped=false,lock=null;

  /* storage: one record per browser. {label,end,left,state:'run'|'pause'} */
  function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
  function save(v){st=v;try{v?localStorage.setItem(KEY,JSON.stringify(v)):localStorage.removeItem(KEY)}catch(e){}}

  function p2(n){return String(n).padStart(2,'0')}
  function fmt(ms){
    var t=Math.max(0,Math.ceil(ms/1000)),d=Math.floor(t/86400),h=Math.floor(t%86400/3600),m=Math.floor(t%3600/60),s=t%60;
    var c='<span class="c">:</span>';
    return (d?d+'d '+p2(h):p2(h))+c+p2(m)+c+p2(s);
  }
  function plain(ms){var t=Math.max(0,Math.ceil(ms/1000));return (t>=3600?Math.floor(t/3600)+':':'')+p2(Math.floor(t%3600/60))+':'+p2(t%60)}
  function endsAt(ts){var d=new Date(ts),now=new Date(),same=d.toDateString()===now.toDateString();
    return 'Ends '+(same?'':d.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'})+', ')+d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}

  function beep(){try{var AC=window.AudioContext||window.webkitAudioContext,a=new AC();[0,.35,.7].forEach(function(t){var o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.3);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.32)});setTimeout(function(){a.close()},1500)}catch(e){}}

  /* keep the screen awake while a timer runs (where the browser allows it) */
  function wake(on){
    if(!('wakeLock' in navigator))return;
    if(on&&!lock&&document.visibilityState==='visible'){navigator.wakeLock.request('screen').then(function(l){lock=l;l.addEventListener('release',function(){lock=null})}).catch(function(){})}
    if(!on&&lock){lock.release().catch(function(){});lock=null}
  }

  function render(){
    st=load();
    var has=!!st;
    face.hidden=!has;ctl.hidden=!has;setup.hidden=has;
    document.body.classList.remove('paused','done');
    if(!has){document.title='Scrap Hack Timer';wake(false);return}
    lblOut.textContent=st.label||'';
    var left=st.state==='pause'?st.left:st.end-Date.now();
    clock.innerHTML=fmt(left);
    $('pause').hidden=st.state!=='run'||left<=0;$('resume').hidden=st.state!=='pause';
    if(st.state==='pause'){document.body.classList.add('paused');sub.textContent='Paused';document.title='Paused / '+plain(left);wake(false);return}
    if(left<=0){
      document.body.classList.add('done');sub.textContent="Time's up";document.title="Time's up!";wake(false);
      if(!beeped&&Date.now()-st.end<60000){beeped=true;beep()}
      return
    }
    beeped=false;sub.textContent=endsAt(st.end);document.title=plain(left)+' / '+(st.label||'Scrap Hack');wake(true);
  }

  /* tick by the wall clock, so time slept is never lost */
  function loop(){render();setTimeout(loop,1000-(Date.now()%1000)+5)}
  document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
  window.addEventListener('focus',render);
  window.addEventListener('pageshow',render);
  window.addEventListener('storage',function(e){if(e.key===KEY)render()}); /* other tabs on this device */

  /* setup form */
  function setMode(m){mode=m;document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-pressed',b.dataset.mode===m)});$('durBox').hidden=m!=='dur';$('untilBox').hidden=m!=='until';err.textContent=''}
  document.querySelectorAll('.tabs button').forEach(function(b){b.addEventListener('click',function(){setMode(b.dataset.mode)})});
  document.querySelectorAll('.presets button').forEach(function(b){b.addEventListener('click',function(){var p=b.dataset.p.split(',');$('h').value=p[0];$('m').value=p[1];$('s').value=0;if(p[2]&&!$('name').value)$('name').value=p[2]})});
  (function(){var t=new Date(Date.now()+3600000);$('ud').value=t.getFullYear()+'-'+p2(t.getMonth()+1)+'-'+p2(t.getDate());$('ut').value=p2(t.getHours())+':00'})();

  setup.addEventListener('submit',function(e){
    e.preventDefault();var end;
    if(mode==='dur'){
      var ms=((+$('h').value||0)*3600+(+$('m').value||0)*60+(+$('s').value||0))*1000;
      if(ms<=0){err.textContent='Set a time above zero.';return}
      end=Date.now()+ms;
    }else{
      if(!$('ud').value||!$('ut').value){err.textContent='Pick a date and a time.';return}
      var d=$('ud').value.split('-'),t=$('ut').value.split(':');
      end=new Date(+d[0],+d[1]-1,+d[2],+t[0],+t[1],0).getTime();
      if(end<=Date.now()){err.textContent='That time has already passed.';return}
    }
    err.textContent='';beeped=false;
    save({label:$('name').value.trim(),end:end,left:0,state:'run'});render();
  });

  /* controls */
  $('pause').addEventListener('click',function(){st=load();if(!st||st.state!=='run')return;save({label:st.label,end:0,left:Math.max(0,st.end-Date.now()),state:'pause'});render()});
  $('resume').addEventListener('click',function(){st=load();if(!st||st.state!=='pause')return;save({label:st.label,end:Date.now()+st.left,left:0,state:'run'});render()});
  function nudge(ms){st=load();if(!st)return;
    if(st.state==='pause')st.left=Math.max(0,st.left+ms);else{st.end=Math.max(Date.now(),st.end+ms)}
    save(st);render()}
  $('plus').addEventListener('click',function(){nudge(5*60000)});
  $('minus').addEventListener('click',function(){nudge(-5*60000)});
  $('reset').addEventListener('click',function(){if(confirm('Reset the timer on this device?')){save(null);render()}});
  $('full').addEventListener('click',function(){var d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(function(){})});
  document.addEventListener('fullscreenchange',function(){$('full').textContent=document.fullscreenElement?'Exit full screen':'Full screen'});

  /* projector mode: controls fade out after 3s without the mouse */
  var idle;function poke(){document.body.classList.remove('calm');clearTimeout(idle);idle=setTimeout(function(){if(load())document.body.classList.add('calm')},3000)}
  ['mousemove','pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,poke,{passive:true})});

  /* ---------- background scrap ---------- */
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var PARTS=[
    /* resistor */ '<svg viewBox="0 0 80 24"><path d="M2 12h18M60 12h18" stroke="#b9bec3" stroke-width="3" stroke-linecap="round"/><rect x="18" y="4" width="44" height="16" rx="7" fill="#d9b98a"/><path d="M28 4v16M35 4v16M42 4v16" stroke-width="4" stroke="#a53208"/><path d="M52 4v16" stroke-width="4" stroke="#c9833a"/></svg>',
    /* screw */ '<svg viewBox="0 0 24 60"><circle cx="12" cy="9" r="9" fill="#b9bec3"/><path d="M6 9h12M12 3v12" stroke="#5d5a52" stroke-width="2.5"/><path d="M8 17h8l-1 34-3 7-3-7z" fill="#9aa0a6"/><path d="M8 24l8-3M8 31l8-3M8 38l8-3M9 45l6-2" stroke="#5d5a52" stroke-width="1.6"/></svg>',
    /* gear */ '<svg viewBox="0 0 60 60"><path d="M26 2h8l1 7 6 3 6-4 5 5-4 6 3 6 7 1v8l-7 1-3 6 4 6-5 5-6-4-6 3-1 7h-8l-1-7-6-3-6 4-5-5 4-6-3-6-7-1v-8l7-1 3-6-4-6 5-5 6 4 6-3z" fill="#e2491a"/><circle cx="30" cy="30" r="9" fill="#1a1510"/></svg>',
    /* capacitor */ '<svg viewBox="0 0 30 64"><path d="M11 44v18M19 44v14" stroke="#b9bec3" stroke-width="2.5" stroke-linecap="round"/><rect x="3" y="2" width="24" height="44" rx="5" fill="#3d7bd4"/><rect x="3" y="2" width="24" height="5" rx="2" fill="#d0d4d8"/><rect x="19" y="10" width="5" height="32" fill="#2b5aa0"/></svg>',
    /* led */ '<svg viewBox="0 0 24 60"><path d="M8 30v28M16 30v22" stroke="#b9bec3" stroke-width="2.5" stroke-linecap="round"/><path d="M3 30V13a9 9 0 0 1 18 0v17z" fill="#ff4a2a"/><rect x="1" y="28" width="22" height="4" rx="1" fill="#c23d0e"/></svg>',
    /* chip */ '<svg viewBox="0 0 64 44"><path d="M10 0v8M20 0v8M30 0v8M40 0v8M50 0v8M10 36v8M20 36v8M30 36v8M40 36v8M50 36v8" stroke="#b9bec3" stroke-width="3"/><rect x="2" y="7" width="60" height="30" rx="3" fill="#2a2a2a"/><circle cx="10" cy="15" r="2.5" fill="#5d5a52"/></svg>',
    /* battery */ '<svg viewBox="0 0 30 70"><rect x="10" y="0" width="10" height="6" rx="1" fill="#d9b25b"/><rect x="2" y="5" width="26" height="64" rx="5" fill="#3d7bd4"/><rect x="2" y="5" width="26" height="12" rx="4" fill="#d9b25b"/><path d="M15 34v10M10 39h10" stroke="#fbf0b6" stroke-width="3"/></svg>',
    /* spring */ '<svg viewBox="0 0 70 26"><path d="M2 13h6c3-12 6-12 9 0s6 12 9 0 6-12 9 0 6 12 9 0 6-12 9 0h9" fill="none" stroke="#b9bec3" stroke-width="3" stroke-linecap="round"/></svg>',
    /* board */ '<svg viewBox="0 0 70 46"><rect x="1" y="1" width="68" height="44" rx="4" fill="#2f8a3e"/><path d="M8 12h22v12h18M8 34h30M46 8v30" stroke="#cfd8a0" stroke-width="2" fill="none"/><rect x="40" y="26" width="20" height="12" fill="#1c1c1c"/><circle cx="8" cy="12" r="3" fill="#ffe500"/><circle cx="46" cy="8" r="3" fill="#ffe500"/></svg>',
    /* wire */ '<svg viewBox="0 0 70 40"><path d="M4 30C20 2 34 40 50 14S66 8 66 8" fill="none" stroke="#e8553a" stroke-width="4" stroke-linecap="round"/><path d="M60 4l10 6" stroke="#c9833a" stroke-width="3" stroke-linecap="round"/></svg>'
  ];
  var bg=$('bg'),N=Math.round(Math.min(30,Math.max(14,innerWidth/55)));
  for(var i=0;i<N;i++){
    var d=34+Math.random()*40,b=document.createElement('div');b.className='bit';
    b.style.left=(Math.random()*96)+'%';
    b.style.setProperty('--d',d+'s');b.style.setProperty('--dl',(-Math.random()*d)+'s');
    b.style.setProperty('--sw',(4+Math.random()*5)+'s');b.style.setProperty('--rt',(16+Math.random()*30)+'s');b.style.setProperty('--rd',Math.random()<.5?'normal':'reverse');
    b.style.setProperty('--w',(30+Math.random()*42)+'px');b.style.setProperty('--o',(.22+Math.random()*.26).toFixed(2));
    if(reduce)b.style.bottom=(Math.random()*90)+'%';
    b.innerHTML='<div>'+PARTS[i%PARTS.length]+'</div>';bg.appendChild(b);
  }

  /* ---------- the crew: they watch the clock, or the mouse if it moves ---------- */
  document.querySelectorAll('[data-char]').forEach(function(s){var t=$('tpl-'+s.dataset.char);if(t)s.appendChild(t.content.cloneNode(true))});
  document.querySelectorAll('.look').forEach(function(l){l.style.animationDelay=(-Math.random()*5.5)+'s'});
  var tx=null,ty=null,eyeRaf=0;
  function look(){eyeRaf=0;
    var c=clock.getBoundingClientRect(),gx=tx==null?c.left+c.width/2:tx,gy=ty==null?c.top+c.height/2:ty;
    document.querySelectorAll('.crew .eye').forEach(function(eye){
      var ball=eye.querySelector('.ball'),b=ball.getBoundingClientRect(),k=b.width/(+ball.getAttribute('r')*2)||1;
      var dx=gx-(b.left+b.width/2),dy=gy-(b.top+b.height/2),dd=Math.hypot(dx,dy)||1,m=+eye.dataset.m,f=Math.min(1,dd/(60*k+10));
      eye.querySelector('.pupil').style.transform='translate('+(dx/dd*m*f).toFixed(2)+'px,'+(dy/dd*m*f).toFixed(2)+'px)';
    })}
  function lookSoon(){if(!eyeRaf)eyeRaf=requestAnimationFrame(look)}
  var back;
  document.addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;lookSoon();clearTimeout(back);back=setTimeout(function(){tx=ty=null;lookSoon()},2500)},{passive:true});
  addEventListener('resize',lookSoon);setInterval(lookSoon,2000);setTimeout(lookSoon,300);
  var SAY={tosta:['ding!','keep going','toast break?'],fanny:['whirrr!','full speed','stay cool'],bulby:['bright idea!','lights on','you got this']},said={};
  document.querySelectorAll('.crew .slot').forEach(function(s){s.addEventListener('click',function(){
    var k=s.dataset.char,n=said[k]=(said[k]||0)+1,arr=SAY[k],old=s.querySelector('.say');if(old)old.remove();
    var b=document.createElement('span');b.className='say';b.textContent=load()&&document.body.classList.contains('done')?"time's up!":arr[(n-1)%arr.length];s.appendChild(b);setTimeout(function(){b.remove()},1900)})});

  loop();poke();
})();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scrap Hack Challenge</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14100c">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Random challenge game for the hackathon floor. Spin, read it out, play. The deck is shuffled per device, so nothing repeats until every challenge has come up. */
:root{--ink:#14100c;--bench:#1a1510;--paper:#ebe2cf;--yellow:#ffe500;--rust:#e2491a;--mute:#b8ab92;--line:#3a3025;--display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;--sans:'Instrument Sans',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bench);color:#f3ead6;font-family:var(--sans);font-size:16px;line-height:1.5;display:flex;flex-direction:column;min-height:100svh}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase}
.top a{text-decoration:none;color:#d9cdb4;padding:8px 0}
.top a:hover{color:var(--yellow)}

main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px 20px 40px;gap:clamp(18px,3.4vh,34px)}
.kick{margin:0;font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;text-transform:uppercase;font-size:clamp(22px,3.4vw,40px);line-height:1;color:var(--yellow)}

/* the card the challenge lands on */
.card{position:relative;width:min(980px,100%);min-height:clamp(220px,34vh,360px);display:flex;flex-direction:column;justify-content:center;gap:14px;background:#fbf6e6;color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:clamp(24px,4vw,48px) clamp(20px,5vw,60px);box-shadow:9px 10px 0 var(--rust);transform:rotate(-1deg)}
.card .no{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#a53208}
.card .tx{margin:0;font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 80,"opsz" 96;font-size:clamp(30px,5.2vw,68px);line-height:1.02;text-wrap:balance}
.card .tx i{display:block;margin-top:14px;font-style:normal;font-family:var(--sans);font-weight:600;font-size:clamp(18px,2.4vw,28px);line-height:1.3;color:#5d5444}
.card .tx i b{color:var(--ink)}
.card.idle .tx{color:#8d806a}
.card.rolling .tx{opacity:.55}
.card.land{animation:land .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes land{0%{transform:rotate(-1deg) scale(.94)}100%{transform:rotate(-1deg) scale(1)}}

.ctl{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{min-height:46px;padding:10px 20px;border-radius:10px;border:2px solid #f3ead6;background:transparent;font-weight:600;font-size:16px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.06)}
.btn.go{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.btn.go:hover{background:#fff56b}
.btn.big{min-height:60px;padding:12px 34px;font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 80,"opsz" 48;text-transform:uppercase;font-size:26px;border-width:3px;border-color:var(--ink);box-shadow:5px 6px 0 var(--rust)}
.btn.big:hover{transform:translate(2px,3px);box-shadow:2px 3px 0 var(--rust)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px;border-color:#5a4c3a;color:#d9cdb4}
.btn:disabled{opacity:.5;cursor:default;transform:none}

/* optional countdown for the timed ones */
.cd{font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;font-variant-numeric:tabular-nums;font-size:clamp(48px,8vw,96px);line-height:1;color:#f7efdc}
.cd.low{color:var(--rust)}
.left{margin:0;font-size:13px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

/* background: scrap parts drifting up (same as the timer page) */
.top,main,footer{position:relative;z-index:2}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bit{position:absolute;bottom:-90px;animation:rise var(--d) linear var(--dl) infinite;will-change:transform}
.bit>div{animation:sway var(--sw) ease-in-out var(--dl) infinite alternate}
.bit svg{display:block;width:var(--w);height:auto;opacity:var(--o);animation:turn var(--rt) linear infinite;animation-direction:var(--rd)}
@keyframes rise{to{transform:translateY(calc(-100vh - 180px))}}
@keyframes sway{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes turn{to{transform:rotate(360deg)}}
.paused .bit,.paused .bit>div,.paused .bit svg{animation-play-state:paused}
.done .bg{animation:shake .25s linear infinite}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}

/* the crew from the main site, sitting along the bottom and watching the card */
.crew{position:fixed;left:0;right:0;bottom:-6px;z-index:1;display:flex;justify-content:space-between;align-items:flex-end;padding:0 clamp(12px,4vw,56px);pointer-events:none}
.crew .slot{width:clamp(64px,7vw,108px);pointer-events:auto;cursor:pointer}
.crew .slot:nth-child(2){margin-bottom:-14px}
.slot svg{display:block;width:100%;height:auto;overflow:visible}
.sticker{filter:drop-shadow(3px 0 0 #fbf0b6) drop-shadow(-3px 0 0 #fbf0b6) drop-shadow(0 3px 0 #fbf0b6) drop-shadow(0 -3px 0 #fbf0b6) drop-shadow(6px 9px 0 rgba(0,0,0,.35))}
.bob{animation:bob 3.6s ease-in-out infinite}
.bob.b2{animation-duration:4.2s;animation-delay:-1.2s}
.bob.b3{animation-duration:3.1s;animation-delay:-2s}
.look{transform-box:fill-box;transform-origin:center;animation:eyeblink 5.5s infinite}
.pupil{transition:transform .2s ease-out}
.blades{animation:spin 1.1s linear infinite;transform-origin:100px 70px}
.waver{animation:wave 1.4s ease-in-out infinite}
.glow{animation:glim 2.6s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes eyeblink{0%,91%,100%{transform:scaleY(1)}94.5%{transform:scaleY(.08)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes wave{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
@keyframes glim{0%,100%{opacity:.3}45%{opacity:.7}50%{opacity:.2}55%{opacity:.75}}
.paused .blades,.paused .waver{animation-play-state:paused}
.done .crew .slot{animation:hop .5s ease-in-out infinite alternate}
.done .crew .slot:nth-child(2){animation-delay:-.25s}
@keyframes hop{to{transform:translateY(-22px)}}
.say{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);background:#fbf0b6;color:var(--ink);font:600 14px/1 var(--sans);padding:8px 11px;border-radius:12px;white-space:nowrap;box-shadow:2px 3px 0 rgba(0,0,0,.35);pointer-events:none;animation:say 1.9s ease forwards}
.say::after{content:"";position:absolute;left:50%;top:100%;margin-left:-6px;border:6px solid transparent;border-top-color:#fbf0b6}
@keyframes say{0%{opacity:0;transform:translateX(-50%) translateY(6px) scale(.8)}12%,80%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-6px)}}
.crew .slot{position:relative}
main{padding-bottom:clamp(100px,11vw,150px)}
@media (max-width:600px){.crew .slot{width:58px}main{padding-bottom:96px}}
@media (prefers-reduced-motion:reduce){.bit,.bit>div,.bit svg,.bob,.look,.blades,.waver,.glow,.done .bg,.done .crew .slot{animation:none!important}}

/* keep the middle of the floor clear for the buttons: Fanny joins Tosta on the left */
.crew{justify-content:flex-start;gap:clamp(8px,2vw,28px)}
.crew .slot:nth-child(3){margin-left:auto}
.crew .slot:nth-child(2){margin-bottom:0}
.calm .top,.calm .ctl,.calm .left{opacity:0;transition:opacity .4s}
.calm{cursor:none}
@media (prefers-reduced-motion:reduce){.card.land{animation:none}}
</style>
</head>

<div class="bg" id="bg" aria-hidden="true"></div>
<div class="crew" aria-hidden="true"><div class="slot bob" data-char="tosta"></div><div class="slot bob b2" data-char="fanny"></div><div class="slot bob b3" data-char="bulby"></div></div>
<header class="top"><a href="../index.html">&larr; Scrap Hack</a><a href="../timer/index.html">Timer &rarr;</a></header>

<main>
  <p class="kick">Random challenge</p>
  <div class="card idle" id="card" aria-live="polite">
    <span class="no" id="no">Ready when you are</span>
    <p class="tx" id="tx">Hit spin to pick a challenge for a team.</p>
  </div>
  <div class="cd" id="cd" hidden></div>
  <div class="ctl">
    <button class="btn go big" id="spin" type="button">Spin</button>
  </div>
  <div class="ctl" id="tctl" hidden>
    <button class="btn sm" type="button" data-sec="30">30 s timer</button>
    <button class="btn sm" type="button" data-sec="60">60 s timer</button>
    <button class="btn sm" type="button" id="stopcd" hidden>Stop timer</button>
    <button class="btn sm" type="button" id="full">Full screen</button>
    <button class="btn sm" type="button" id="reshuffle">Reshuffle deck</button>
  </div>
  <p class="left" id="left"></p>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* the challenges. Add more here: [challenge, optional detail line]. */
  var CH=[
    ['Pitch your project like an ad.',''],
    ['Pick one part and give it a name, a personality and a tragic backstory.',''],
    ['Say the alphabet backwards as a team, one letter each.',''],
    ['Say this tongue twister 3 times fast.','<b>pathanapurath path pacha thatha chath kuthi irinnu</b>'],
    ['Recreate a famous movie scene in one second.','The scene has to be at least 20 seconds long.'],
    ['Convince a mentor to do a victory pose with your team.',''],
    ['Dumb charades: act out a Malayalam movie.','']
  ];

  /* a shuffled deck per device: nothing repeats until every challenge has come up */
  var KEY='scraphack.challenge.v1';
  function shuffled(){var a=CH.map(function(_,i){return i});for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function load(){try{var d=JSON.parse(localStorage.getItem(KEY));if(d&&d.n===CH.length&&Array.isArray(d.deck))return d}catch(e){}return null}
  function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
  var st=load()||{n:CH.length,deck:shuffled(),cur:null,last:null};

  var card=$('card'),noEl=$('no'),txEl=$('tx'),spinBtn=$('spin'),left=$('left'),rolling=false;
  function show(i){card.classList.remove('idle');noEl.textContent='Challenge '+(i+1)+' of '+CH.length;txEl.innerHTML=CH[i][0]+(CH[i][1]?'<i>'+CH[i][1]+'</i>':'')}
  function count(){var n=st.deck.length;left.textContent=n?n+' left before the deck reshuffles':'Every challenge done. The next spin reshuffles.'}

  function spin(){
    if(rolling)return;rolling=true;spinBtn.disabled=true;stopCd();
    if(!st.deck.length){st.deck=shuffled();if(st.deck[0]===st.last&&st.deck.length>1)st.deck.push(st.deck.shift())}
    var pick=st.deck.shift();st.cur=pick;st.last=pick;save(st);
    var steps=reduce?1:16,k=0,shown=-1;
    card.classList.add('rolling');card.classList.remove('land');
    (function roll(){
      k++;
      if(k>=steps){card.classList.remove('rolling');show(pick);void card.offsetWidth;card.classList.add('land');rolling=false;spinBtn.disabled=false;spinBtn.textContent='Spin again';$('tctl').hidden=false;count();cheer();return}
      var r;do{r=Math.floor(Math.random()*CH.length)}while(r===shown&&CH.length>1);shown=r;
      noEl.textContent='Spinning…';txEl.innerHTML=CH[r][0];card.classList.remove('idle');
      setTimeout(roll,50+Math.pow(k/steps,3)*260);
    })();
  }
  spinBtn.addEventListener('click',spin);
  document.addEventListener('keydown',function(e){if((e.key===' '||e.key==='Enter')&&e.target===document.body){e.preventDefault();spin()}});
  $('reshuffle').addEventListener('click',function(){st.deck=shuffled();save(st);count()});

  /* countdown: wall-clock based, so it stays right if the tab is in the background */
  var cdEl=$('cd'),cdEnd=0,cdT=0;
  function stopCd(){clearTimeout(cdT);cdEnd=0;cdEl.hidden=true;cdEl.classList.remove('low');$('stopcd').hidden=true;document.body.classList.remove('done')}
  function tickCd(){var ms=cdEnd-Date.now();
    if(ms<=0){cdEl.textContent="Time's up";cdEl.classList.add('low');document.body.classList.add('done');beep();cdT=setTimeout(function(){document.body.classList.remove('done')},4000);return}
    var s=Math.ceil(ms/1000);cdEl.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');cdEl.classList.toggle('low',s<=5);cdT=setTimeout(tickCd,ms%1000||1000)}
  document.querySelectorAll('[data-sec]').forEach(function(b){b.addEventListener('click',function(){stopCd();cdEnd=Date.now()+(+b.dataset.sec)*1000;cdEl.hidden=false;$('stopcd').hidden=false;tickCd()})});
  $('stopcd').addEventListener('click',stopCd);
  function beep(){try{var AC=window.AudioContext||window.webkitAudioContext,a=new AC();[0,.3,.6].forEach(function(t){var o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+t+.25);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.27)});setTimeout(function(){a.close()},1300)}catch(e){}}

  $('full').addEventListener('click',function(){var d=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else if(d.requestFullscreen)d.requestFullscreen().catch(function(){})});
  document.addEventListener('fullscreenchange',function(){$('full').textContent=document.fullscreenElement?'Exit full screen':'Full screen'});
  var idle;function poke(){document.body.classList.remove('calm');clearTimeout(idle);idle=setTimeout(function(){if(document.fullscreenElement)document.body.classList.add('calm')},3000)}
  ['mousemove','pointerdown','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,poke,{passive:true})});

  /* the crew reacts when a challenge lands */
  var LINES=['ooh, good one','no backing out','go go go','this one is hard','camera ready?'];
  function cheer(){var s=document.querySelectorAll('.crew .slot');if(!s.length||reduce)return;var x=s[Math.floor(Math.random()*s.length)],old=x.querySelector('.say');if(old)old.remove();
    var b=document.createElement('span');b.className='say';b.textContent=LINES[Math.floor(Math.random()*LINES.length)];x.appendChild(b);setTimeout(function(){b.remove()},1900)}

  /* bring back the last challenge after a reload */
  if(st.cur!=null&&CH[st.cur]){show(st.cur);spinBtn.textContent='Spin again';$('tctl').hidden=false}
  count();

  /* background and crew, shared with the timer page; the crew watches the card */
  var clock=card;
  /* ---------- background scrap ---------- */
    var PARTS=[
    /* resistor */ '<svg viewBox="0 0 80 24"><path d="M2 12h18M60 12h18" stroke="#b9bec3" stroke-width="3" stroke-linecap="round"/><rect x="18" y="4" width="44" height="16" rx="7" fill="#d9b98a"/><path d="M28 4v16M35 4v16M42 4v16" stroke-width="4" stroke="#a53208"/><path d="M52 4v16" stroke-width="4" stroke="#c9833a"/></svg>',
    /* screw */ '<svg viewBox="0 0 24 60"><circle cx="12" cy="9" r="9" fill="#b9bec3"/><path d="M6 9h12M12 3v12" stroke="#5d5a52" stroke-width="2.5"/><path d="M8 17h8l-1 34-3 7-3-7z" fill="#9aa0a6"/><path d="M8 24l8-3M8 31l8-3M8 38l8-3M9 45l6-2" stroke="#5d5a52" stroke-width="1.6"/></svg>',
    /* gear */ '<svg viewBox="0 0 60 60"><path d="M26 2h8l1 7 6 3 6-4 5 5-4 6 3 6 7 1v8l-7 1-3 6 4 6-5 5-6-4-6 3-1 7h-8l-1-7-6-3-6 4-5-5 4-6-3-6-7-1v-8l7-1 3-6-4-6 5-5 6 4 6-3z" fill="#e2491a"/><circle cx="30" cy="30" r="9" fill="#1a1510"/></svg>',
    /* capacitor */ '<svg viewBox="0 0 30 64"><path d="M11 44v18M19 44v14" stroke="#b9bec3" stroke-width="2.5" stroke-linecap="round"/><rect x="3" y="2" width="24" height="44" rx="5" fill="#3d7bd4"/><rect x="3" y="2" width="24" height="5" rx="2" fill="#d0d4d8"/><rect x="19" y="10" width="5" height="32" fill="#2b5aa0"/></svg>',
    /* led */ '<svg viewBox="0 0 24 60"><path d="M8 30v28M16 30v22" stroke="#b9bec3" stroke-width="2.5" stroke-linecap="round"/><path d="M3 30V13a9 9 0 0 1 18 0v17z" fill="#ff4a2a"/><rect x="1" y="28" width="22" height="4" rx="1" fill="#c23d0e"/></svg>',
    /* chip */ '<svg viewBox="0 0 64 44"><path d="M10 0v8M20 0v8M30 0v8M40 0v8M50 0v8M10 36v8M20 36v8M30 36v8M40 36v8M50 36v8" stroke="#b9bec3" stroke-width="3"/><rect x="2" y="7" width="60" height="30" rx="3" fill="#2a2a2a"/><circle cx="10" cy="15" r="2.5" fill="#5d5a52"/></svg>',
    /* battery */ '<svg viewBox="0 0 30 70"><rect x="10" y="0" width="10" height="6" rx="1" fill="#d9b25b"/><rect x="2" y="5" width="26" height="64" rx="5" fill="#3d7bd4"/><rect x="2" y="5" width="26" height="12" rx="4" fill="#d9b25b"/><path d="M15 34v10M10 39h10" stroke="#fbf0b6" stroke-width="3"/></svg>',
    /* spring */ '<svg viewBox="0 0 70 26"><path d="M2 13h6c3-12 6-12 9 0s6 12 9 0 6-12 9 0 6 12 9 0 6-12 9 0h9" fill="none" stroke="#b9bec3" stroke-width="3" stroke-linecap="round"/></svg>',
    /* board */ '<svg viewBox="0 0 70 46"><rect x="1" y="1" width="68" height="44" rx="4" fill="#2f8a3e"/><path d="M8 12h22v12h18M8 34h30M46 8v30" stroke="#cfd8a0" stroke-width="2" fill="none"/><rect x="40" y="26" width="20" height="12" fill="#1c1c1c"/><circle cx="8" cy="12" r="3" fill="#ffe500"/><circle cx="46" cy="8" r="3" fill="#ffe500"/></svg>',
    /* wire */ '<svg viewBox="0 0 70 40"><path d="M4 30C20 2 34 40 50 14S66 8 66 8" fill="none" stroke="#e8553a" stroke-width="4" stroke-linecap="round"/><path d="M60 4l10 6" stroke="#c9833a" stroke-width="3" stroke-linecap="round"/></svg>'
  ];
  var bg=$('bg'),N=Math.round(Math.min(30,Math.max(14,innerWidth/55)));
  for(var i=0;i<N;i++){
    var d=34+Math.random()*40,b=document.createElement('div');b.className='bit';
    b.style.left=(Math.random()*96)+'%';
    b.style.setProperty('--d',d+'s');b.style.setProperty('--dl',(-Math.random()*d)+'s');
    b.style.setProperty('--sw',(4+Math.random()*5)+'s');b.style.setProperty('--rt',(16+Math.random()*30)+'s');b.style.setProperty('--rd',Math.random()<.5?'normal':'reverse');
    b.style.setProperty('--w',(30+Math.random()*42)+'px');b.style.setProperty('--o',(.22+Math.random()*.26).toFixed(2));
    if(reduce)b.style.bottom=(Math.random()*90)+'%';
    b.innerHTML='<div>'+PARTS[i%PARTS.length]+'</div>';bg.appendChild(b);
  }

  /* ---------- the crew: they watch the clock, or the mouse if it moves ---------- */
  document.querySelectorAll('[data-char]').forEach(function(s){var t=$('tpl-'+s.dataset.char);if(t)s.appendChild(t.content.cloneNode(true))});
  document.querySelectorAll('.look').forEach(function(l){l.style.animationDelay=(-Math.random()*5.5)+'s'});
  var tx=null,ty=null,eyeRaf=0;
  function look(){eyeRaf=0;
    var c=clock.getBoundingClientRect(),gx=tx==null?c.left+c.width/2:tx,gy=ty==null?c.top+c.height/2:ty;
    document.querySelectorAll('.crew .eye').forEach(function(eye){
      var ball=eye.querySelector('.ball'),b=ball.getBoundingClientRect(),k=b.width/(+ball.getAttribute('r')*2)||1;
      var dx=gx-(b.left+b.width/2),dy=gy-(b.top+b.height/2),dd=Math.hypot(dx,dy)||1,m=+eye.dataset.m,f=Math.min(1,dd/(60*k+10));
      eye.querySelector('.pupil').style.transform='translate('+(dx/dd*m*f).toFixed(2)+'px,'+(dy/dd*m*f).toFixed(2)+'px)';
    })}
  function lookSoon(){if(!eyeRaf)eyeRaf=requestAnimationFrame(look)}
  var back;
  document.addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;lookSoon();clearTimeout(back);back=setTimeout(function(){tx=ty=null;lookSoon()},2500)},{passive:true});
  addEventListener('resize',lookSoon);setInterval(lookSoon,2000);setTimeout(lookSoon,300);
  var SAY={tosta:['ding!','keep going','toast break?'],fanny:['whirrr!','full speed','stay cool'],bulby:['bright idea!','lights on','you got this']},said={};
  document.querySelectorAll('.crew .slot').forEach(function(s){s.addEventListener('click',function(){
    var k=s.dataset.char,n=said[k]=(said[k]||0)+1,arr=SAY[k],old=s.querySelector('.say');if(old)old.remove();
    var b=document.createElement('span');b.className='say';b.textContent=document.body.classList.contains('done')?"time's up!":arr[(n-1)%arr.length];s.appendChild(b);setTimeout(function(){b.remove()},1900)})});

  poke();
})();
</script>

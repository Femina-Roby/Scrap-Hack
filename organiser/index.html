<style>
:root{--ink:#14100c;--bench:#1a1510;--yellow:#ffe500;--mute:#b8ab92;--line:#3a3025;--display:'Bricolage Grotesque','Arial Narrow',system-ui,sans-serif;--sans:'Instrument Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bench);color:#f3ead6;font-family:var(--sans);font-size:18px;line-height:1.6;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
a{color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.top{border-bottom:1px solid rgba(255,255,255,.08)}
.top .in{max-width:1160px;margin-inline:auto;padding:14px 20px;display:flex;justify-content:space-between;gap:16px;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.top a{text-decoration:none;color:#d9cdb4}
.top a:hover{color:var(--yellow)}
.top .apply{background:var(--yellow);color:var(--ink);padding:6px 12px;border-radius:6px;font-weight:700}
main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1160px;width:100%;margin-inline:auto;padding:48px 20px}
.doc{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow);margin:0 0 18px}
h1{margin:0;font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 75,"opsz" 96;text-transform:uppercase;font-size:clamp(56px,13vw,180px);line-height:.84;letter-spacing:-.015em}
h1 .y{color:var(--yellow)}
p.s{margin:28px 0 0;max-width:30rem;font-size:clamp(17px,1.7vw,21px);color:#e4d8bd}
p.s a{color:var(--yellow)}
footer{padding:22px 20px 26px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);max-width:1160px;width:100%;margin-inline:auto}
footer a{color:#f3ead6}
</style>
<header class="top"><div class="in"><a href="/">&larr; Scrap Hack</a><a class="apply" href="/#venues">Apply now</a></div></header>
<main>
  <p class="doc">Organiser's note</p>
  <h1>Coming<br><span class="y">soon.</span></h1>

<footer>Scrap Hack 2026 / TinkerHub Foundation</footer>
